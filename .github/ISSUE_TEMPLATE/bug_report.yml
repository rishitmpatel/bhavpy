name: Bug report
description: Wrong numbers, crashes, or surprising behaviour
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: bhavpy and Python versions, OS
    validations:
      required: true
