name: Feature or new data source
description: Suggest a dataset or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source URL (archive file preferred)
      description: Only public, no-login sources can be used.
