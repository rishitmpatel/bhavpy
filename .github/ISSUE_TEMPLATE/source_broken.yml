name: Data source broke
description: A function that used to work now errors or returns wrong data
labels: ["source-broken"]
body:
  - type: input
    id: call
    attributes:
      label: Call that fails
      placeholder: bp.history("RELIANCE", "2024-01-01")
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Full error text
      description: FormatChanged / BlockedError messages include the URL and columns seen.
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: bhavpy and Python versions
      placeholder: bhavpy 0.1.0, Python 3.12, Windows 11
    validations:
      required: true
